#CI项目
name: TESTS

#CI计划
on:
  #手动触发
  workflow_dispatch:
  #推送到主分支且改动脚本/配置/测试/文档时执行
  push:
    branches: [main]
    paths:
      - 'Scripts/**'
      - 'tests/**'
      - 'Config/**'
      - 'Patches/**'
      - 'Docs/**'
      - '.github/workflows/**'
  #PR 全量校验
  pull_request:

#CI权限
permissions:
  contents: read

#同一分支/PR 的重复触发自动取消，避免排队等待
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

#CI任务
jobs:
  unit:
    name: Unit & Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Environment
        run: |
          bash --version | head -n 1
          git --version
          awk --version 2>/dev/null | head -n 1 || true

      - name: Run Test Suite
        # 测试脚本自建沙箱与 mock，不需要 root、不需要 Docker、不访问网络。
        run: bash tests/run_all_tests.sh
